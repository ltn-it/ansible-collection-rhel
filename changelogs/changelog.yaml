  1.24.0:
    changes:
      bugfixes:
        - logrotate - Preserve case-distinct Linux file paths and native component
          directories during deduplication.
        - logrotate - Reject symbolic-link components in all source and protected
          paths before mutation.
        - logrotate - Require runtime-owned mode-0600 replacement files for prepared
          container rename rotation.
        - logrotate - accept canonical positive archive-count text forwarded through
          Ansible variables while rejecting fractions, booleans and out-of-range values.
        - logrotate - defer timer tasks and restart handlers during fresh-install
          check mode until the RPM vendor unit exists.
        - logrotate - fix gzip numbering and verify effective archive names with the
          vendor parser before preparation without changing global configuration.
        - logrotate - include dot-prefixed numbered archives in label and hardlink
          checks, and defer SELinux label validation in check mode when the target
          Python bindings have not yet been installed; real applies still fail.
        - logrotate - keep archives beside validated log sources and explicitly override
          inherited olddir, copying, hardlink and shredding settings to preserve protected
          data.
        - logrotate - limit SELinux mappings and non-recursive relabeling to selected
          native log files, their numbered archives and required directories; retire
          the former role-owned namespace mapping without traversing protected data.
        - logrotate - pass timer calendars after the command option boundary so option-like
          values cannot bypass calendar validation before timer configuration is published.
        - logrotate - preserve traversal of private runtime probe ancestry under a
          restrictive root umask without changing the ownership or access mode of
          the probe logs.
        - logrotate - reject a selected source silently skipped by the vendor because
          an earlier overlapping rule enables ignoreduplicates, even when the debug
          command returns success.
        - logrotate - reject existing hardlinked rotation sources before installing
          a rule.
        - logrotate - reject numbered active sources and archive families that collide
          with selected active paths or protected trees before preparation.
        - logrotate - repeat the effective vendor configuration check after native
          log file preparation, so existing wildcard rules cannot silently overlap
          a newly created source.
        - logrotate - tolerate only unrelated existing date-archive collisions during
          forced debug validation, preserving candidate and parser failure checks.
        - logrotate - validate candidates at their actual include position in a private
          read-only directory view so later global resets cannot hide inherited names.
        - logrotate - validate real source paths against existing vendor rules before
          substituting private archive-layout fixtures.
        - podman - manage rootless storage file-context mappings through community.general.sefcontext
          and report restorecon changes only for actual relabels, avoiding repeated
          changes on an already configured EL10 host.
      minor_changes:
        - Document Nexus candidates, exact-byte validated Galaxy promotion, transition
          limitations, and per-Collection cutover evidence.
        - Release preparation and back-sync rely on native central review events instead
          of dispatching the retired local review workflow.
        - logrotate - add an operating-system RPM role with validated explicit rules
          and the existing vendor timer.
        - logrotate - optionally prepare private existing-account-owned native Podman
          log files and persistent SELinux labels in the standard component namespace
          before application startup, preserving existing content and refusing foreign
          owners, links or unsafe directory metadata.
        - logrotate - reject protected data/backup paths and document per-file retention
          and polling limits explicitly.
        - logrotate - replace the unshipped experimental component-log helper role
          with the RPM-based role.
