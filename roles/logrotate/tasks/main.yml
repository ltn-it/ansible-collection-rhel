---
- name: Prechecks
  ansible.builtin.import_tasks: assert.yml
  tags: always

- name: Inspect explicitly selected existing log files
  ansible.builtin.stat:
    path: "{{ logrotate_path }}"
    follow: false
    get_checksum: false
    get_mime: false
  loop: "{{ logrotate_paths }}"
  loop_control:
    loop_var: logrotate_path
  register: logrotate_existing_files

- name: Refuse existing symlinks and non-regular rotation sources
  ansible.builtin.assert:
    that:
      - not logrotate_file.stat.exists or logrotate_file.stat.isreg | default(false)
      - not logrotate_file.stat.islnk | default(false)
      - not logrotate_file.stat.exists or logrotate_file.stat.nlink | default(0) == 1
    quiet: true
  loop: "{{ logrotate_existing_files.results }}"
  loop_control:
    loop_var: logrotate_file

- name: Inspect the vendor timer before predicting package installation
  ansible.builtin.stat:
    path: /usr/lib/systemd/system/logrotate.timer
    get_checksum: false
    get_mime: false
  register: logrotate_vendor_timer

- name: Install logrotate from configured operating system RPM repositories
  ansible.builtin.package:
    name: [logrotate, util-linux]
    state: present

- name: Validate effective vendor archive names before preparing selected files
  ansible.builtin.import_tasks: effective_layout.yml

- name: Prepare the explicitly selected standard container log destinations
  ansible.builtin.import_tasks: prepare_container_files.yml
  vars:
    logrotate_container_paths: >-
      {{ logrotate_paths | select('match', '^/var/log/podman-components/') | list }}
  when:
    - logrotate_prepare_container_files | bool
    - logrotate_paths | select('match', '^/var/log/podman-components/') | list | length > 0

- name: Revalidate vendor rules after selected log files exist
  ansible.builtin.import_tasks: effective_layout.yml
  when:
    - logrotate_prepare_container_files | bool
    - logrotate_paths | select('match', '^/var/log/podman-components/') | list | length > 0

- name: Validate the explicitly selected vendor timer calendar
  ansible.builtin.command:
    argv: [/usr/bin/systemd-analyze, calendar, --, "{{ logrotate_timer_calendar }}"]
  changed_when: false
  check_mode: false
  when: logrotate_timer_calendar | length > 0

- name: Install the validated application logrotate rule
  ansible.builtin.template:
    src: application.conf.j2
    dest: "/etc/logrotate.d/{{ logrotate_name }}"
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/logrotate --debug %s

- name: Create the vendor timer override directory when requested
  ansible.builtin.file:
    path: /etc/systemd/system/logrotate.timer.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: logrotate_timer_calendar | length > 0

- name: Configure the vendor timer check interval
  ansible.builtin.template:
    src: timer.conf.j2
    dest: /etc/systemd/system/logrotate.timer.d/60-lit-logrotate.conf
    owner: root
    group: root
    mode: "0644"
  when: logrotate_timer_calendar | length > 0
  notify: Reload logrotate timer

- name: Remove a previous LIT calendar override when using the vendor default
  ansible.builtin.file:
    path: /etc/systemd/system/logrotate.timer.d/60-lit-logrotate.conf
    state: absent
  when: logrotate_timer_calendar | length == 0
  notify: Reload logrotate timer

- name: Report deferred timer reconciliation on a fresh-install dry run
  ansible.builtin.debug:
    msg: >-
      Vendor timer activation is deferred in check mode until the real RPM
      installation provides logrotate.timer. Run a real apply before claiming activation.
  when:
    - ansible_check_mode
    - not logrotate_vendor_timer.stat.exists

- name: Apply a changed vendor timer override before reconciling activation
  ansible.builtin.meta: flush_handlers

- name: Reconcile vendor logrotate timer activation
  ansible.builtin.systemd_service:
    name: logrotate.timer
    enabled: "{{ logrotate_timer_enabled }}"
    state: "{{ 'started' if logrotate_timer_enabled else 'stopped' }}"
  when: not ansible_check_mode or logrotate_vendor_timer.stat.exists
