---
- name: Validate component log policy interface
  ansible.builtin.assert:
    that:
      - podman_log_config_component is match('^[A-Za-z0-9][A-Za-z0-9_.-]{0,100}$')
      - podman_log_config_container is match('^[A-Za-z0-9][A-Za-z0-9_.-]{0,100}$')
      - podman_log_config_user is match('^[a-z_][a-z0-9_-]*$')
      - podman_log_config_group is match('^[a-z_][a-z0-9_-]*$')
      - (podman_log_config_uid | string) is match('^[1-9][0-9]*$')
      - podman_log_config_operational is boolean
      - podman_log_config_manage_service is boolean
      - podman_log_config_quadlet_path is string
      - podman_log_config_runtime_root == '/run/user/' ~ (podman_log_config_uid | string)
    quiet: true

- name: Validate paths used in units and native policy configuration
  ansible.builtin.assert:
    that:
      - podman_log_config_path is string
      - podman_log_config_path is match('^/[A-Za-z0-9_./-]+$')
      - "'/../' not in podman_log_config_path"
      - "'/./' not in podman_log_config_path"
      - "not podman_log_config_path.endswith('/..')"
      - "not podman_log_config_path.endswith('/.')"
      - "'//' not in podman_log_config_path"
      - podman_log_config_path != '/'
    quiet: true
  loop:
    - "{{ podman_log_config_home }}"
    - "{{ podman_log_config_graphroot }}"
    - "{{ podman_log_config_directory }}"
    - "{{ podman_log_config_conmon }}"
    - "{{ podman_log_config_podman }}"
    - "{{ podman_log_config_python }}"
    - "{{ podman_log_config_helper_directory }}"
    - "{{ podman_log_config_conmon_wrapper }}"
    - "{{ podman_log_config_config_directory }}"
    - "{{ podman_log_config_unit_directory }}"
  loop_control:
    loop_var: podman_log_config_path

- name: Validate an explicitly selected rootless Quadlet source
  ansible.builtin.assert:
    that:
      - podman_log_config_quadlet_path is match('^/[A-Za-z0-9_./-]+\.(kube|container)$')
      - "'..' not in podman_log_config_quadlet_path.split('/')"
      - "'.' not in podman_log_config_quadlet_path.split('/')"
      - "'//' not in podman_log_config_quadlet_path"
      - >-
        podman_log_config_quadlet_path.startswith(podman_log_config_home + '/.config/containers/systemd/') or
        podman_log_config_quadlet_path.startswith('/etc/containers/systemd/users/' ~
          (podman_log_config_uid | string) ~ '/')
      - podman_log_config_quadlet_service is match('^[A-Za-z0-9][A-Za-z0-9_.-]*\.service$')
    quiet: true
  when: podman_log_config_quadlet_path | length > 0
