---
- name: Render root controlled inode metadata target
  ansible.builtin.template:
    src: inode-guard.json.j2
    dest: "{{ podman_log_config_config_directory }}/{{ podman_log_config_component }}.inode-guard.json"
    owner: root
    group: root
    mode: "0600"

- name: Render bounded inode metadata service and socket
  ansible.builtin.template:
    src: "inode-guard.{{ podman_log_config_inode_guard_unit_type }}.j2"
    dest: >-
      {{ podman_log_config_unit_directory }}/{{ podman_log_config_inode_guard_unit
      }}.{{ podman_log_config_inode_guard_unit_type }}
    owner: root
    group: root
    mode: "0644"
  loop: [service, socket]
  loop_control:
    loop_var: podman_log_config_inode_guard_unit_type
  register: podman_log_config_inode_guard_units
