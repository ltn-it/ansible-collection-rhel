---
- name: Reject noncanonical native source paths
  ansible.builtin.command:
    argv:
      - "{{ podman_log_config_python }}"
      - -B
      - -c
      - "import pathlib,sys; p=pathlib.Path(sys.argv[1]); sys.exit(p.resolve()!=p)"
      - "{{ podman_log_config_quadlet_path }}"
  changed_when: false
  check_mode: false

- name: Inspect the explicitly prepared native Quadlet
  ansible.builtin.stat:
    path: "{{ podman_log_config_quadlet_path }}"
    follow: false
  register: podman_log_config_native_source

- name: Require an existing protected native source
  ansible.builtin.assert:
    that:
      - podman_log_config_native_source.stat.exists
      - podman_log_config_native_source.stat.isreg | default(false)
      - podman_log_config_native_source.stat.uid | default(-1) in [0, podman_log_config_uid | int]
      - not podman_log_config_native_source.stat.wgrp | default(true)
      - not podman_log_config_native_source.stat.woth | default(true)
    quiet: true

- name: Bind the existing user service to the selected native source
  ansible.builtin.command:
    argv:
      - /usr/bin/systemctl
      - --user
      - show
      - --property=SourcePath
      - --value
      - "{{ podman_log_config_quadlet_service }}"
  become: true
  become_user: "{{ podman_log_config_user }}"
  environment:
    HOME: "{{ podman_log_config_home }}"
    XDG_RUNTIME_DIR: "{{ podman_log_config_runtime_root }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path={{ podman_log_config_runtime_root }}/bus"
  args:
    chdir: /
  register: podman_log_config_native_binding
  changed_when: false
  failed_when: >-
    podman_log_config_native_binding.rc != 0 or
    podman_log_config_native_binding.stdout | trim != podman_log_config_quadlet_path
  when: podman_log_config_manage_service
  check_mode: false

- name: Create a dedicated native log-policy drop-in directory
  ansible.builtin.file:
    path: "{{ podman_log_config_quadlet_path }}.d"
    state: directory
    owner: "{{ podman_log_config_user if podman_log_config_manage_service else podman_log_config_install_owner }}"
    group: "{{ podman_log_config_group if podman_log_config_manage_service else podman_log_config_install_group }}"
    mode: "0700"

- name: Render the native log policy without replacing the source manifest
  ansible.builtin.template:
    src: native-log-policy.conf.j2
    dest: "{{ podman_log_config_quadlet_path }}.d/70-component-logs.conf"
    owner: "{{ podman_log_config_user if podman_log_config_manage_service else podman_log_config_install_owner }}"
    group: "{{ podman_log_config_group if podman_log_config_manage_service else podman_log_config_install_group }}"
    mode: "0600"
  register: podman_log_config_native_dropin

- name: Inspect the actual selected native log policy before reconciliation
  ansible.builtin.command:
    argv: &podman_log_config_native_policy_probe
      - /usr/bin/setpriv
      - --no-new-privs
      - "{{ podman_log_config_python }}"
      - -B
      - -c
      - |
        import sys
        try:
            sys.path.insert(0, sys.argv[1])
            import main as component_logs
            model = component_logs.Component(component_logs.load_config(sys.argv[2])).inspect()
            if not model["running"]:
                raise ValueError("native writer is not running")
            print("COMPONENT_NATIVE_POLICY_ACTIVE")
        except Exception as error:
            print("COMPONENT_NATIVE_POLICY_UNCONFIRMED", file=sys.stderr)
            recoverable = {"native rotation policy is not active", "native writer is not running"}
            sys.exit(1 if type(error) is ValueError and str(error) in recoverable else 2)
      - "{{ podman_log_config_helper_directory }}"
      - "{{ podman_log_config_config }}"
    stdin: ""
    stdin_add_newline: false
  become: true
  become_user: "{{ podman_log_config_user }}"
  environment: &podman_log_config_native_policy_environment
    HOME: "{{ podman_log_config_home }}"
    XDG_RUNTIME_DIR: "{{ podman_log_config_runtime_root }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path={{ podman_log_config_runtime_root }}/bus"
  changed_when: false
  failed_when: >-
    podman_log_config_native_policy_before.rc not in [0, 1] or
    (podman_log_config_native_policy_before.rc == 0 and
     podman_log_config_native_policy_before.stdout | trim != 'COMPONENT_NATIVE_POLICY_ACTIVE')
  register: podman_log_config_native_policy_before
  when:
    - podman_log_config_manage_service
    - not ansible_check_mode

- name: Reconcile only the explicitly selected rootless native service
  ansible.builtin.systemd_service:
    scope: user
    name: "{{ podman_log_config_quadlet_service }}"
    daemon_reload: true
    state: restarted
  become: true
  become_user: "{{ podman_log_config_user }}"
  environment:
    HOME: "{{ podman_log_config_home }}"
    XDG_RUNTIME_DIR: "{{ podman_log_config_runtime_root }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path={{ podman_log_config_runtime_root }}/bus"
  when:
    - podman_log_config_manage_service
    - >-
      podman_log_config_native_dropin.changed or
      (podman_log_config_native_policy_before.rc | default(0)) != 0

- name: Verify the actual selected native log policy after reconciliation
  ansible.builtin.command:
    argv: *podman_log_config_native_policy_probe
    stdin: ""
    stdin_add_newline: false
  become: true
  become_user: "{{ podman_log_config_user }}"
  environment: *podman_log_config_native_policy_environment
  changed_when: false
  register: podman_log_config_native_policy_after
  failed_when: >-
    podman_log_config_native_policy_after.rc != 0 or
    podman_log_config_native_policy_after.stdout | trim != 'COMPONENT_NATIVE_POLICY_ACTIVE'
  when:
    - podman_log_config_manage_service
    - not ansible_check_mode
