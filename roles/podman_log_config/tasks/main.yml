---
- name: Prechecks
  ansible.builtin.import_tasks: assert.yml
  tags: always

- name: Verify existing runtime user before enabling the collector
  ansible.builtin.command:
    argv: [/usr/bin/id, -u, "{{ podman_log_config_user }}"]
  register: podman_log_config_user_identity
  changed_when: false
  failed_when: >-
    podman_log_config_user_identity.rc != 0 or
    podman_log_config_user_identity.stdout | int != podman_log_config_uid | int
  when: podman_log_config_manage_service
  check_mode: false

- name: Create shared helper and configuration directories
  ansible.builtin.file:
    path: "{{ podman_log_config_shared_directory }}"
    state: directory
    owner: "{{ podman_log_config_install_owner }}"
    group: "{{ podman_log_config_install_group }}"
    mode: "0755"
  loop:
    - "{{ podman_log_config_helper_directory }}"
    - "{{ podman_log_config_config_directory }}"
    - "{{ podman_log_config_unit_directory }}"
  loop_control:
    loop_var: podman_log_config_shared_directory

- name: Install versioned component log helpers
  ansible.builtin.copy:
    src: "component_logs/{{ podman_log_config_helper }}"
    dest: "{{ podman_log_config_helper_directory }}/{{ podman_log_config_helper }}"
    owner: "{{ podman_log_config_install_owner }}"
    group: "{{ podman_log_config_install_group }}"
    mode: "0644"
  loop: [main.py, archive_store.py, bounded_capture.py]
  loop_control:
    loop_var: podman_log_config_helper

- name: Install explicit native conmon policy wrapper
  ansible.builtin.template:
    src: conmon-wrapper.sh.j2
    dest: "{{ podman_log_config_conmon_wrapper }}"
    owner: "{{ podman_log_config_install_owner }}"
    group: "{{ podman_log_config_install_group }}"
    mode: "0755"

- name: Create private component log directories
  ansible.builtin.file:
    path: "{{ podman_log_config_private_directory }}"
    state: directory
    owner: "{{ podman_log_config_user if podman_log_config_manage_service else podman_log_config_install_owner }}"
    group: "{{ podman_log_config_group if podman_log_config_manage_service else podman_log_config_install_group }}"
    mode: "0700"
  loop:
    - "{{ podman_log_config_directory }}"
    - "{{ podman_log_config_directory }}/archives"
  loop_control:
    loop_var: podman_log_config_private_directory

- name: Render instance-specific component policy
  ansible.builtin.template:
    src: config.json.j2
    dest: "{{ podman_log_config_config }}"
    owner: "{{ podman_log_config_install_owner }}"
    group: "{{ podman_log_config_install_group }}"
    mode: "0644"

- name: Validate installed configuration without running container commands
  ansible.builtin.command:
    argv:
      - "{{ podman_log_config_python }}"
      - -B
      - "{{ podman_log_config_helper_directory }}/main.py"
      - --config
      - "{{ podman_log_config_config }}"
      - --validate
  changed_when: false
  when: not ansible_check_mode

- name: Render persistent collector service and timer
  ansible.builtin.template:
    src: "collector.{{ podman_log_config_unit_type }}.j2"
    dest: "{{ podman_log_config_unit_directory }}/{{ podman_log_config_unit }}.{{ podman_log_config_unit_type }}"
    owner: "{{ podman_log_config_install_owner }}"
    group: "{{ podman_log_config_install_group }}"
    mode: "0644"
  loop: [service, timer]
  loop_control:
    loop_var: podman_log_config_unit_type
  register: podman_log_config_units

- name: Reload systemd after changed collector units
  ansible.builtin.systemd_service:
    daemon_reload: true
  when:
    - podman_log_config_manage_service
    - podman_log_config_units.changed

- name: Enable the component collector timer
  ansible.builtin.systemd_service:
    name: "{{ podman_log_config_unit }}.timer"
    enabled: true
    state: started
  when: podman_log_config_manage_service
