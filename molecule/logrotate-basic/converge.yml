---
- name: Exercise packaged logrotate input checks and rendering without changing the controller OS
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    # A schema fixture only: this scenario does not install an RPM or run systemd.
    ansible_facts:
      os_family: RedHat
    logrotate_test_root: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/logrotate"
    logrotate_name: example
    logrotate_paths: ["{{ logrotate_test_root }}/application.log"]
    logrotate_protected_directories: ["{{ logrotate_test_root }}/backups"]
    logrotate_test_role: >-
      {{ lookup('ansible.builtin.env', 'ANSIBLE_COLLECTIONS_PATH').split(':')[0]
         }}/ansible_collections/lit/rhel/roles/logrotate
  tasks:
    - name: Load packaged role defaults and validate the schema fixture
      ansible.builtin.include_role:
        name: lit.rhel.logrotate
        tasks_from: assert
        public: true

    - name: Accept a canonical archive count transported as templated text
      ansible.builtin.include_role:
        name: lit.rhel.logrotate
        tasks_from: assert
      vars:
        logrotate_archive_count: "7"

    - name: Reject fractional archive counts instead of truncating them
      block:
        - name: Validate an intentionally invalid fractional archive count
          ansible.builtin.include_role:
            name: lit.rhel.logrotate
            tasks_from: assert
          vars:
            logrotate_archive_count: "7.5"
        - name: Record unexpected fractional count acceptance
          ansible.builtin.set_fact:
            logrotate_test_accepted_fraction: true
      rescue:
        - name: Record expected fractional count rejection
          ansible.builtin.set_fact:
            logrotate_test_rejected_fraction: true

    - name: Require fail-closed fractional count handling
      ansible.builtin.assert:
        that:
          - logrotate_test_rejected_fraction | default(false)
          - not logrotate_test_accepted_fraction | default(false)

    - name: Create the private rendering fixture
      ansible.builtin.file:
        path: "{{ logrotate_test_root }}"
        state: directory
        mode: "0700"

    - name: Render the freshly installed package template
      ansible.builtin.template:
        src: "{{ logrotate_test_role }}/templates/application.conf.j2"
        dest: "{{ logrotate_test_root }}/application.conf"
        mode: "0600"

    - name: Attempt to include a data backup as a rotation source
      block:
        - name: Validate an intentionally forbidden backup path
          ansible.builtin.include_role:
            name: lit.rhel.logrotate
            tasks_from: assert
          vars:
            logrotate_paths: ["{{ logrotate_test_root }}/backups/database.sql"]

        - name: Record unexpected acceptance
          ansible.builtin.set_fact:
            logrotate_test_accepted_backup: true
      rescue:
        - name: Record expected backup exclusion
          ansible.builtin.set_fact:
            logrotate_test_rejected_backup: true

    - name: Require actual backup exclusion
      ansible.builtin.assert:
        that:
          - logrotate_test_rejected_backup | default(false)
          - not logrotate_test_accepted_backup | default(false)

    - name: Prepare an isolated protected-data alias fixture
      ansible.builtin.file:
        path: "{{ logrotate_test_root }}/backups"
        state: directory
        mode: "0700"

    - name: Create the symbolic alias without touching real backup data
      ansible.builtin.file:
        src: "{{ logrotate_test_root }}/backups"
        dest: "{{ logrotate_test_root }}/alias"
        state: link

    - name: Reject an aliased source ancestor before rule installation
      block:
        - name: Validate an intentionally aliased rotation source
          ansible.builtin.include_role:
            name: lit.rhel.logrotate
            tasks_from: assert
          vars:
            logrotate_paths: ["{{ logrotate_test_root }}/alias/database.sql"]
        - name: Fail if the source alias was accepted
          ansible.builtin.fail:
            msg: A source alias was accepted.
      rescue:
        - name: Require the intended source-alias rejection
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Reject symbolic-link components in log and protected paths'
              - ansible_failed_result.rc == 1

    - name: Reject an aliased protected directory before rule installation
      block:
        - name: Validate an intentionally aliased protection declaration
          ansible.builtin.include_role:
            name: lit.rhel.logrotate
            tasks_from: assert
          vars:
            logrotate_paths: ["{{ logrotate_test_root }}/backups/database.sql"]
            logrotate_protected_directories: ["{{ logrotate_test_root }}/alias"]
        - name: Fail if the protection alias was accepted
          ansible.builtin.fail:
            msg: A protected-directory alias was accepted.
      rescue:
        - name: Require the intended protection-alias rejection
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Reject symbolic-link components in log and protected paths'
              - ansible_failed_result.rc == 1

    - name: Reject incompatible replacement metadata for prepared container logs
      block:
        - name: Validate intentionally incompatible rename settings
          ansible.builtin.include_role:
            name: lit.rhel.logrotate
            tasks_from: assert
          vars:
            logrotate_paths: [/var/log/podman-components/example/application.log]
            logrotate_prepare_container_files: true
            logrotate_container_user: application
            logrotate_container_group: application
        - name: Fail if incompatible rename settings were accepted
          ansible.builtin.fail:
            msg: Incompatible rename metadata was accepted.
      rescue:
        - name: Require the intended replacement-metadata rejection
          ansible.builtin.assert:
            that: >-
              ansible_failed_task.name ==
              'Require rename rotation settings compatible with prepared container log files'

    - name: Accept matching runtime-owned replacements for rename rotation
      ansible.builtin.include_role:
        name: lit.rhel.logrotate
        tasks_from: assert
      vars:
        logrotate_paths: [/var/log/podman-components/example/application.log]
        logrotate_prepare_container_files: true
        logrotate_container_user: application
        logrotate_container_group: application
        logrotate_user: application
        logrotate_group: application
        logrotate_create_mode: "0600"
