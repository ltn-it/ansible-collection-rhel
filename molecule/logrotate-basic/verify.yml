---
- name: Verify the packaged controller fixture without claiming runtime rotation
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    logrotate_test_root: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/logrotate"
  tasks:
    - name: Inspect the installed package for the retired helper role
      ansible.builtin.stat:
        path: >-
          {{ lookup('ansible.builtin.env', 'ANSIBLE_COLLECTIONS_PATH').split(':')[0]
             }}/ansible_collections/lit/rhel/roles/podman_log_config
        follow: false
      register: logrotate_test_retired_role

    - name: Require the package to omit the retired helper role
      ansible.builtin.assert:
        that:
          - not logrotate_test_retired_role.stat.exists

    - name: Read the rendered rule
      ansible.builtin.slurp:
        src: "{{ logrotate_test_root }}/application.conf"
      register: logrotate_test_rendered

    - name: Require the documented RPM directives and no helper entry point
      ansible.builtin.assert:
        that:
          - "'daily' in (logrotate_test_rendered.content | b64decode)"
          - "'maxsize 100M' in (logrotate_test_rendered.content | b64decode)"
          - "'rotate 7' in (logrotate_test_rendered.content | b64decode)"
          - "'maxage 14' in (logrotate_test_rendered.content | b64decode)"
          - "'nodelaycompress' in (logrotate_test_rendered.content | b64decode)"
          - "'start 1' in (logrotate_test_rendered.content | b64decode)"
          - "'compresscmd /usr/bin/gzip' in (logrotate_test_rendered.content | b64decode)"
          - "'uncompresscmd /usr/bin/gunzip' in (logrotate_test_rendered.content | b64decode)"
          - "'compressext .gz' in (logrotate_test_rendered.content | b64decode)"
          - "'compressoptions -6' in (logrotate_test_rendered.content | b64decode)"
          - "'copytruncate' not in (logrotate_test_rendered.content | b64decode).split()"
          - "'noolddir' in (logrotate_test_rendered.content | b64decode)"
          - "'nocopy' in (logrotate_test_rendered.content | b64decode).split()"
          - "'norenamecopy' in (logrotate_test_rendered.content | b64decode).split()"
          - "'nocopytruncate' in (logrotate_test_rendered.content | b64decode)"
          - "'noallowhardlink' in (logrotate_test_rendered.content | b64decode)"
          - "'noshred' in (logrotate_test_rendered.content | b64decode)"
          - "'podman-component' not in (logrotate_test_rendered.content | b64decode)"
